[package]
name = "save_audio_stream"
version = "0.3.4"
edition = "2024"

[features]
# Recording AAC (src/aac_encoder.rs). Off by default and never in a release
# artifact: the encoder is Fraunhofer FDK AAC, whose licence is not OSI-approved
# and grants no patent rights. `cargo build --release --features aac` has it; any
# other build refuses a session with `audio_format = "aac"`.
aac = ["dep:fdk-aac"]

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
symphonia = { version = "0.5", features = ["mp3", "aac"] }
chrono = "0.4"
httpdate = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossbeam-channel = "0.5"
# The AAC encoder, behind the `aac` feature below and in no release artifact.
fdk-aac = { package = "fdk-aac-prebuilt", git = "https://github.com/andrewtheguy/fdk-aac-prebuilt", tag = "v2.0.3-20260906161257-b191431", features = ["x86-64-v3"], optional = true }
opus = { package = "opus-prebuilt", git = "https://github.com/andrewtheguy/libopus-prebuilt", tag = "v1.6.1-20260906161304-8dd83e8" }
ogg = "0.9"
hound = "3.5"
sea-query = { version = "0.32", features = ["backend-sqlite", "backend-postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
bytes = "1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
fs2 = "0.4"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
serde_json = "1"
serde_bytes = "0.11"
ssh2 = "0.9.5"
crc32fast = "1.4"
dashmap = "5.5"
base64 = "0.22"
urlencoding = "2.1"
dirs = "5"
# The built frontend, compiled into the binary (src/web.rs): build.rs puts the
# bundle in Cargo's OUT_DIR and the server is one file, with no web root beside
# it to find, configure or get wrong. `debug-embed` so a debug build is the same
# one file — the crate would otherwise read the folder from disk at run time in
# debug, which is a second serving path. `interpolate-folder-path` lets the derive
# read Cargo's private output. `mime-guess` names each file's content type from
# its extension.
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }

[build-dependencies]
anyhow = "1"
